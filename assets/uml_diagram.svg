200,260 L300,237" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><rect x="300" y="270" width="310" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="314" y="290" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="314" dy="0">update_product_stock()</tspan></text><text x="314" y="307" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="314" dy="0">add or set stock · writes products</tspan></text><path d="M200,260 L300,293" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><rect x="300" y="326" width="310" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="314" y="346" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="314" dy="0">process_customer_sale()</tspan></text><text x="314" y="363" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="314" dy="0">writes products and sales</tspan></text><path d="M200,260 L300,349" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><rect x="300" y="382" width="310" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="314" y="402" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="314" dy="0">view_sales_records()</tspan></text><text x="314" y="419" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="314" dy="0">reads sales</tspan></text><path d="M200,260 L300,405" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><rect x="300" y="438" width="310" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="314" y="458" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="314" dy="0">generate_store_report()</tspan></text><text x="314" y="475" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="314" dy="0">reads products and sales</tspan></text><path d="M200,260 L300,461" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><text x="236" y="150" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle"><tspan x="236" dy="0">«calls»</tspan></text><rect x="730" y="160" width="240" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="744" y="184" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="744" dy="0">find_product(product_id)</tspan></text><text x="744" y="204" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="744" dy="0">loops products, returns the</tspan></text><text x="744" y="218" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="744" dy="0">matching dict or None</tspan></text><path d="M610,125 L730,176" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a_blue)"/><path d="M610,237 L730,188" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a_blue)"/><path d="M610,293 L730,200" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a_blue)"/><path d="M610,349 L730,212" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a_blue)"/><text x="672" y="150" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="middle"><tspan x="672" dy="0">«calls»</tspan></text><rect x="730" y="290" width="240" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="744" y="312" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="744" dy="0">«data» products</tspan></text><text x="744" y="331" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="744" dy="0">list of dict: id, name, category,</tspan></text><text x="744" y="346" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="744" dy="0">price, stock (starts with 4 items)</tspan></text><rect x="730" y="380" width="240" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="744" y="402" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="744" dy="0">«data» sales</tspan></text><text x="744" y="421" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="744" dy="0">list of dict: product_id, product_name,</tspan></text><text x="744" y="436" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="744" dy="0">quantity, total_amount (starts empty)</tspan></text><path d="M850,224 L850,290" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a_amber)"/><text x="858" y="262" font-size="11" fill="#92400e" font-weight="600" text-anchor="start"><tspan x="858" dy="0">«reads»</tspan></text><rect x="30" y="380" width="200" height="104" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="44" y="402" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="44" dy="0">«builtin» functions</tspan></text><text x="44" y="422" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="44" dy="0">input(), print()</tspan></text><text x="44" y="438" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="44" dy="0">int(), float()</tspan></text><text x="44" y="454" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="44" dy="0">len(), str.strip()</tspan></text><text x="44" y="470" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="44" dy="0">str.lower(), str.isdigit()</tspan></text><text x="30" y="512" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Solid arrows: «calls». Dashed: data access. 'reads' and 'writes' on each box show which list the function uses.</tspan></text></svg>