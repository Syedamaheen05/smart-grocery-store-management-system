fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45"/><text x="475.0" y="209" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle"><tspan x="475.0" dy="0">try / except</tspan></text><rect x="570" y="38" width="390" height="184" rx="10" fill="#0b1220" stroke="#334155"/><path d="M570,48 a10,10 0 0 1 10,-10 h370 a10,10 0 0 1 10,10 v18 h-390 z" fill="#1e293b"/><circle cx="588" cy="52" r="5" fill="#ef4444"/><circle cx="604" cy="52" r="5" fill="#f59e0b"/><circle cx="620" cy="52" r="5" fill="#22c55e"/><text x="765" y="56" font-size="12" fill="#94a3b8" font-weight="normal" text-anchor="middle"><tspan x="765" dy="0">grocery_store.py</tspan></text><text y="94" font-size="13.5" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan x="590"><tspan fill="#c084fc">def </tspan><tspan fill="#60a5fa">find_product</tspan><tspan fill="#e2e8f0">(product_id):</tspan></tspan></text><text y="117" font-size="13.5" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan x="590"><tspan fill="#c084fc">    for </tspan><tspan fill="#e2e8f0">product </tspan><tspan fill="#c084fc">in </tspan><tspan fill="#e2e8f0">products:</tspan></tspan></text><text y="140" font-size="13.5" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan x="590"><tspan fill="#c084fc">        if </tspan><tspan fill="#e2e8f0">product[</tspan><tspan fill="#86efac">"id"</tspan><tspan fill="#e2e8f0">] == product_id:</tspan></tspan></text><text y="163" font-size="13.5" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan x="590"><tspan fill="#c084fc">            return </tspan><tspan fill="#e2e8f0">product</tspan></tspan></text><text y="186" font-size="13.5" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan x="590"><tspan fill="#c084fc">    return </tspan><tspan fill="#c084fc">None</tspan></tspan></text><text x="590" y="208" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="590" dy="0"># returns the product dictionary or None</tspan></text></svg>