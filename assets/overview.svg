<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="'Segoe UI', Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a_slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a_dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="1000" height="490" fill="#ffffff"/><rect x="20" y="20" width="960" height="452" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><rect x="20" y="20" width="960" height="64" rx="14" fill="#12372a"/><rect x="20" y="60" width="960" height="24" fill="#12372a"/><text x="44" y="50" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Task: Smart Grocery Store Management System</tspan></text><text x="44" y="73" font-size="13.5" fill="#d7f0e2" font-weight="normal" text-anchor="start"><tspan x="44" dy="0">File: grocery_store.py   |   Topic: lists, dictionaries, functions, loops, validation</tspan></text><rect x="44" y="102" width="218" height="222" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="153" y="130" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle"><tspan x="153" dy="0">Input</tspan></text><text x="60" y="156" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">Menu choice 1-8</tspan></text><text x="60" y="182" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">Product ID, name,</tspan></text><text x="60" y="208" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">category, price, stock</tspan></text><text x="60" y="234" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">Search text (ID or name)</tspan></text><text x="60" y="260" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">Add / set stock quantity</tspan></text><text x="60" y="286" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">Purchase quantity</tspan></text><rect x="273" y="102" width="218" height="222" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="382" y="130" font-size="16" fill="#7c3aed" font-weight="700" text-anchor="middle"><tspan x="382" dy="0">Rules</tspan></text><text x="289" y="156" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">No duplicate product IDs</tspan></text><text x="289" y="182" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">ID &gt; 0, price &gt;= 0, stock &gt;= 0</tspan></text><text x="289" y="208" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">Name and category not empty</tspan></text><text x="289" y="234" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">Quantity &gt; 0 for add / sale</tspan></text><text x="289" y="260" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">Sale only if stock is enough</tspan></text><text x="289" y="286" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">Low stock = fewer than 5</tspan></text><rect x="502" y="102" width="218" height="222" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="611" y="130" font-size="16" fill="#16a34a" font-weight="700" text-anchor="middle"><tspan x="611" dy="0">Output</tspan></text><text x="518" y="156" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Product list and details</tspan></text><text x="518" y="182" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Updated stock message</tspan></text><text x="518" y="208" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Purchase summary</tspan></text><text x="518" y="234" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Sales records list</tspan></text><text x="518" y="260" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Store report: totals,</tspan></text><text x="518" y="286" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">low stock, max / min price</tspan></text><rect x="731" y="102" width="218" height="222" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="840" y="130" font-size="16" fill="#92400e" font-weight="700" text-anchor="middle"><tspan x="840" dy="0">Concepts</tspan></text><text x="747" y="156" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">list of dictionaries</tspan></text><text x="747" y="182" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">append(), len(), for, while</tspan></text><text x="747" y="208" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">def / return, find_product()</tspan></text><text x="747" y="234" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">if / elif / else</tspan></text><text x="747" y="260" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">try / except ValueError</tspan></text><text x="747" y="286" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">accumulators, min / max</tspan></text><text x="44" y="350" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Main menu (loops until Exit)</tspan></text><rect x="44" y="364" width="218" height="32" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="153.0" y="384.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="153.0" dy="0">1 Add New Product</tspan></text><rect x="273" y="364" width="218" height="32" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="382.0" y="384.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="382.0" dy="0">2 View All Products</tspan></text><rect x="502" y="364" width="218" height="32" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="611.0" y="384.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="611.0" dy="0">3 Search Product</tspan></text><rect x="731" y="364" width="218" height="32" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="840.0" y="384.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="840.0" dy="0">4 Update Product Stock</tspan></text><rect x="44" y="404" width="218" height="32" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="153.0" y="424.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="153.0" dy="0">5 Process Customer Sale</tspan></text><rect x="273" y="404" width="218" height="32" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="382.0" y="424.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="382.0" dy="0">6 View Sales Records</tspan></text><rect x="502" y="404" width="218" height="32" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="611.0" y="424.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="611.0" dy="0">7 Generate Store Report</tspan></text><rect x="731" y="404" width="218" height="32" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="840.0" y="424.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="840.0" dy="0">8 Exit</tspan></text><text x="44" y="460" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start"><tspan x="44" dy="0">Data: products (list of dict) and sales (list of dict), kept in memory while the program runs.</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
